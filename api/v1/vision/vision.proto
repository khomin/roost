syntax = "proto3";

package vision.v1;

import "google/api/annotations.proto";

option go_package = "roost/gen/v1/vision;visionv1";

service VisionService {
  rpc StartStream(StartStreamRequest) returns (stream StartStreamEvent);
  rpc StopStream(StopStreamRequest) returns (StopStreamResponse);
}

message StartStreamRequest {
  string camera_id = 1;
  string source_path = 2;
  CameraType type = 3;
}

message StartStreamEvent {
  oneof event {
    StartStreamResult started = 1;
    FrameDetections detections = 2;
  }
}

message StopStreamRequest {
  string camera_id = 1;
}

message StopStreamResponse {
  bool success = 1;
}

message FrameDetections {
  uint64 timestamp_ns = 1;
  repeated Detection detections = 2;
}

message Detection {
  string label = 1;
  float confidence = 2;
  float x = 3;
  float y = 4;
  float w = 5;
  float h = 6;
}

message StartStreamResult {
  string shm_name = 1;
  uint32 slot_count = 2;
  uint32 slot_size = 3;
  uint32 header_size = 4;
}

enum CameraType {
  CAMERA_TYPE_UNSPECIFIED = 0;
  CAMERA_TYPE_USB = 1;
  CAMERA_TYPE_RTSP = 2;
}
