syntax = "proto3";

package inference.v1;

import "google/api/annotations.proto";

option go_package = "roost/gen/v1/inference;inferencev1";

service DetectionService {
  rpc SubscribeEvents(SubscribeRequest) returns (stream DetectionEvent);
}

message SubscribeRequest {
  repeated string camera_ids = 1;
}

message BoundingBox {
  float x_min = 1;
  float y_min = 2;
  float x_max = 3;
  float y_max = 4;
  float confidence = 5;
  string label = 6; // e.g., "person", "car"
}

message DetectionEvent {
  string camera_id = 1;
  int64 timestamp_ms = 2;
  int64 frame_id = 3;
  bool motion_detected = 4;
  repeated BoundingBox detections = 5;

  // Reference to where the frame lives in Shared Memory if Go needs it for a snapshot
  string shm_key = 6;
  uint64 shm_offset = 7;
}
