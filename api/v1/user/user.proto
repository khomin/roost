syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "roost/gen/user/v1;userv1";

service UserService {
  rpc GetUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = {get: "/v1/user"};
  }
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  string id = 1;
  string name = 2;
}
