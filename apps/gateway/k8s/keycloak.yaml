apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: roost-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          command: ["/opt/keycloak/bin/kc.sh"]
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: HOSTNAME
            - name: KC_PROXY
              value: "edge"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-db:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_DB_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_DB_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
            - name: theme-jar
              mountPath: /opt/keycloak/providers/fintech-theme.jar
              subPath: fintech-theme.jar
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        - name: theme-jar
          configMap:
            name: keycloak-theme-jar

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: roost-prod
spec:
  type: ClusterIP
  selector:
    app: keycloak-db
  ports:
    - port: 5432
      targetPort: 5432