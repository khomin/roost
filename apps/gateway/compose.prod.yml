name: roost

services:
  gateway:
    image: caddy:2-alpine
    container_name: roost_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - whale-frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../frontend/dist:/srv
    extra_hosts:
      - "host.docker.internal:host-gateway"

  whale-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: whale-frontend
    restart: unless-stopped
    depends_on:
      - whale-backend
    environment:
      - VIRTUAL_HOST=${HOSTNAME}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${HOSTNAME}
      - LETSENCRYPT_EMAIL=hominvladimir@gmail.com

  whale-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whale-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "kernel-panic.mooo.com:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: roost_db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./k8s/grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./k8s/grafana/dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./k8s/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: roost_cache
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_server
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./deploy/keycloak/fintech-theme-build/theme/fintech:/opt/keycloak/themes/fintech:ro
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak_db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
